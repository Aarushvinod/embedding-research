[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "byteresearch"
version = "0.1.0"
description = "ByT5 vs mT5 machine translation fine-tuning and interpretability experiments"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["ByteResearch/requirements.txt"] }

[tool.setuptools.packages.find]
include = ["ByteResearch*"]
exclude = ["ByteResearch.tests*", "ByteResearch.artifacts*"]
