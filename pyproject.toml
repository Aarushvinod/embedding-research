[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embedding-research"
version = "0.0.1"
description = "ByteEmbed: byte-level vs subword tokenizer-free multilingual retrieval (BGE-M3 distillation)"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["common", "byte_embed"]
